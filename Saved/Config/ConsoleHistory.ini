History="import unreal\r\n\r\n# 1. ตั้งค่า Path สำหรับจัดเก็บไฟล์ UI ในโปรเจกต์\r\npackage_path = \"/Game/UI/iPad\"\r\nasset_tools = unreal.AssetToolsHelpers.get_asset_tools()\r\n\r\n# สร้างโฟลเดอร์สำหรับเก็บ Widget Blueprint\r\nunreal.EditorAssetLibrary.make_directory(package_path)\r\n\r\n# 2. ฟังก์ชันช่วยปั๊มไฟล์ Widget Blueprint (UMG)\r\ndef create_widget_blueprint(name):\r\n    factory = unreal.WidgetBlueprintFactory()\r\n    factory.set_editor_property(\'parent_class\', unreal.UserWidget)\r\n    new_widget = asset_tools.create_asset(name, package_path, None, factory)\r\n    if new_widget:\r\n        unreal.log(f\"Successfully created iPad Widget: {name}\")\r\n        unreal.EditorAssetLibrary.save_asset(f\"{package_path}/{name}\")\r\n    else:\r\n        unreal.log_error(f\"Failed to create: {name}\")\r\n\r\n# 3. สั่งสร้างหน้าจอ LockScreen และ MainMenu สำหรับ iPad\r\ncreate_widget_blueprint(\"WBP_iPad_LockScreen\")\r\ncreate_widget_blueprint(\"WBP_iPad_MainMenu\")\r\n"
History="import unreal\r\n\r\npackage_path = \"/Game/UI/iPad\"\r\nasset_tools = unreal.AssetToolsHelpers.get_asset_tools()\r\n\r\n# ฟังก์ชันปั๊มไฟล์ Widget อัตโนมัติ\r\ndef create_widget(name):\r\n    if unreal.EditorAssetLibrary.does_asset_exist(f\"{package_path}/{name}\"):\r\n        return\r\n    factory = unreal.WidgetBlueprintFactory()\r\n    factory.set_editor_property(\'parent_class\', unreal.UserWidget)\r\n    new_widget = asset_tools.create_asset(name, package_path, None, factory)\r\n    if new_widget:\r\n        unreal.EditorAssetLibrary.save_asset(f\"{package_path}/{name}\")\r\n\r\n# สั่งสร้างแอปที่เหลือให้ครบตามตาราง Phase 0 - 7\r\ncreate_widget(\"WBP_iPad_Calculator\") # แอปเครื่องคิดเลขวิทยาศาสตร์\r\ncreate_widget(\"WBP_iPad_Browser\")    # แอปเว็บเบราว์เซอร์ Google\r\ncreate_widget(\"WBP_iPad_Camera\")     # แอปกล้องถ่ายรูป\r\ncreate_widget(\"WBP_iPad_Files\")      # แอปคลังภาพ/ไฟล์ภาพถ่าย\r\ncreate_widget(\"WBP_PhotoThumbnail\")   # ชิ้นส่วนแสดงรูปขนาดเล็กในแอปไฟล์\r\n\r\nunreal.log(\"All iPad Apps generated completely!\")\r\n"
History="import unreal\r\n\r\npackage_path = \"/Game/UI/iPad\"\r\neditor_subsystem = unreal.get_editor_subsystem(unreal.UnrealEditorSubsystem)\r\n\r\n# 1. ฟังก์ชันจัดโครงสร้างหน้าตาให้กับ Widget\r\ndef build_ipad_visuals():\r\n    # โหลดไฟล์ที่เราเคยปั๊มไว้\r\n    lockscreen_asset = unreal.load_asset(f\"{package_path}/WBP_iPad_LockScreen\")\r\n    mainmenu_asset = unreal.load_asset(f\"{package_path}/WBP_iPad_MainMenu\")\r\n    \r\n    # --- จัดหน้า LockScreen ---\r\n    if lockscreen_asset:\r\n        # สร้าง Canvas Panel เป็นแกนหลักในการวางวัตถุ\r\n        canvas = unreal.WidgetTreeBlueprintLibrary.create_widget(lockscreen_asset, unreal.CanvasPanel.static_class())\r\n        unreal.WidgetTreeBlueprintLibrary.set_root_widget(lockscreen_asset, canvas)\r\n        \r\n        # ใส่รูปพื้นหลัง (Background Image) เต็มจอ\r\n        bg_image = unreal.WidgetTreeBlueprintLibrary.create_widget(lockscreen_asset, unreal.Image.static_class())\r\n        canvas_slot_bg = canvas.add_child(bg_image)\r\n        # ตั้งค่า Anchor ให้เต็มจอ (Stretch)\r\n        canvas_slot_bg.set_anchors(unreal.Anchors(minimum=[0.0, 0.0], maximum=[1.0, 1.0]))\r\n        canvas_slot_bg.set_offsets(unreal.Margin(left=0.0, top=0.0, right=0.0, bottom=0.0))\r\n        \r\n        # สร้างกล่องข้อความนาฬิกา (Clock Text)\r\n        clock_text = unreal.WidgetTreeBlueprintLibrary.create_widget(lockscreen_asset, unreal.TextBlock.static_class())\r\n        clock_text.set_text(unreal.Text.as_culture_invariant(\"12:00\"))\r\n        canvas_slot_clock = canvas.add_child(clock_text)\r\n        canvas_slot_clock.set_anchors(unreal.Anchors(minimum=[0.5, 0.2], maximum=[0.5, 0.2]))\r\n        canvas_slot_clock.set_alignment(unreal.Vector2D(0.5, 0.5))\r\n        \r\n        # สร้างปุ่มปลดล็อก (Unlock Button) ด้านล่าง\r\n        unlock_button = unreal.WidgetTreeBlueprintLibrary.create_widget(lockscreen_asset, unreal.Button.static_class())\r\n        canvas_slot_btn = canvas.add_child(unlock_button)\r\n        canvas_slot_btn.set_anchors(unreal.Anchors(minimum=[0.5, 0.8], maximum=[0.5, 0.8]))\r\n        canvas_slot_btn.set_alignment(unreal.Vector2D(0.5, 0.5))\r\n        canvas_slot_btn.set_size(unreal.Vector2D(300.0, 80.0))\r\n        \r\n        unreal.EditorAssetLibrary.save_asset(f\"{package_path}/WBP_iPad_LockScreen\")\r\n        unreal.log(\"จัดหน้าตา WBP_iPad_LockScreen เรียบร้อยแล้ว!\")\r\n\r\n    # --- จัดหน้า MainMenu (Home Screen Grid) ---\r\n    if mainmenu_asset:\r\n        canvas_menu = unreal.WidgetTreeBlueprintLibrary.create_widget(mainmenu_asset, unreal.CanvasPanel.static_class())\r\n        unreal.WidgetTreeBlueprintLibrary.set_root_widget(mainmenu_asset, canvas_menu)\r\n        \r\n        # สร้างระบบตาราง Grid สำหรับจัดไอคอนแอปสไตล์ iPad \r\n        grid_panel = unreal.WidgetTreeBlueprintLibrary.create_widget(mainmenu_asset, unreal.UniformGridPanel.static_class())\r\n        canvas_slot_grid = canvas_menu.add_child(grid_panel)\r\n        canvas_slot_grid.set_anchors(unreal.Anchors(minimum=[0.1, 0.1], maximum=[0.9, 0.8]))\r\n        canvas_slot_grid.set_offsets(unreal.Margin(left=0.0, top=0.0, right=0.0, bottom=0.0))\r\n        \r\n        # ปั๊มปุ่มไอคอนแอปจำลองลงตาราง Grid (แถว และ คอลัมน์)\r\n        apps = [\"Google\", \"Camera\", \"Calculator\", \"Files\"]\r\n        for index, app_name in enumerate(apps):\r\n            app_btn = unreal.WidgetTreeBlueprintLibrary.create_widget(mainmenu_asset, unreal.Button.static_class())\r\n            grid_slot = grid_panel.add_child_to_uniform_grid(app_btn)\r\n            # จัดแถวละ 2 แอป (0,0), (0,1), (1,0), (1,1)\r\n            grid_slot.set_row(index // 2)\r\n            grid_slot.set_column(index % 2)\r\n            \r\n        unreal.EditorAssetLibrary.save_asset(f\"{package_path}/WBP_iPad_MainMenu\")\r\n        unreal.log(\"จัดโครงตารางไอคอนแอป WBP_iPad_MainMenu เรียบร้อยแล้ว!\")\r\n\r\n# สั่งรันลอจิกประกอบหน้าตา\r\nbuild_ipad_visuals()\r\n"
