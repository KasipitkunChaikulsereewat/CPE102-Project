History="import unreal\r\n\r\npackage_path = \"/Game/UI/iPad\"\r\nsubsystem = unreal.get_editor_subsystem(unreal.UnrealEditorSubsystem)\r\n\r\ndef build_ipad_ui_fixed():\r\n    # 1. โหลดไฟล์ Asset\r\n    lock_widget = unreal.load_asset(f\"{package_path}/WBP_iPad_LockScreen\")\r\n    menu_widget = unreal.load_asset(f\"{package_path}/WBP_iPad_MainMenu\")\r\n    \r\n    # 📱 --- ประกอบหน้าจอล็อก (WBP_iPad_LockScreen) ---\r\n    if lock_widget:\r\n        # ใช้ Subsystem รีเซ็ต Widget Tree ใหม่\r\n        unreal.WidgetEditingLibrary.clear_widget_blueprint_compiler_errors(lock_widget)\r\n        widget_tree = lock_widget.get_editor_property(\"widget_tree\")\r\n        \r\n        # คลีนของเก่าออกก่อน\r\n        for w in widget_tree.get_all_widgets():\r\n            widget_tree.remove_widget(w)\r\n            \r\n        # สร้าง Canvas Panel หลัก\r\n        root_canvas = widget_tree.construct_widget(unreal.CanvasPanel.static_class(), \"RootCanvas\")\r\n        widget_tree.set_root_widget(root_canvas)\r\n        \r\n        # เพิ่มรูปพื้นหลังสไตล์ iPad\r\n        bg_image = widget_tree.construct_widget(unreal.Image.static_class(), \"Wallpaper\")\r\n        bg_slot = root_canvas.add_child(bg_image)\r\n        bg_slot.set_anchors(unreal.Anchors(minimum=[0.0, 0.0], maximum=[1.0, 1.0]))\r\n        bg_slot.set_offsets(unreal.Margin(left=0.0, top=0.0, right=0.0, bottom=0.0))\r\n        \r\n        # เพิ่มข้อความนาฬิกาดิจิทัลตัวใหญ่\r\n        clock_text = widget_tree.construct_widget(unreal.TextBlock.static_class(), \"Text_Clock\")\r\n        clock_text.set_text(unreal.Text.as_culture_invariant(\"12:00\"))\r\n        clock_slot = root_canvas.add_child(clock_text)\r\n        clock_slot.set_anchors(unreal.Anchors(minimum=[0.5, 0.25], maximum=[0.5, 0.25]))\r\n        clock_slot.set_alignment(unreal.Vector2D(0.5, 0.5))\r\n        \r\n        # เพิ่มปุ่มกดปลดล็อกหน้าจอ\r\n        unlock_btn = widget_tree.construct_widget(unreal.Button.static_class(), \"Btn_Unlock\")\r\n        btn_slot = root_canvas.add_child(unlock_btn)\r\n        btn_slot.set_anchors(unreal.Anchors(minimum=[0.5, 0.75], maximum=[0.5, 0.75]))\r\n        btn_slot.set_alignment(unreal.Vector2D(0.5, 0.5))\r\n        btn_slot.set_size(unreal.Vector2D(350.0, 90.0))\r\n        \r\n        # ⚠️ สำคัญมาก: สั่งบันทึกและรีเฟรช Editor ของตัว Widget\r\n        unreal.WidgetEditingLibrary.compile_widget_blueprint(lock_widget)\r\n        unreal.EditorAssetLibrary.save_asset(f\"{package_path}/WBP_iPad_LockScreen\")\r\n        unreal.log(\"ประกอบและบันทึกหน้า WBP_iPad_LockScreen สำเร็จ!\")\r\n\r\n    # 🖥️ --- ประกอบหน้าจอโฮมและไอคอนแอป (WBP_iPad_MainMenu) ---\r\n    if menu_widget:\r\n        widget_tree = menu_widget.get_editor_property(\"widget_tree\")\r\n        for w in widget_tree.get_all_widgets():\r\n            widget_tree.remove_widget(w)\r\n            \r\n        root_canvas = widget_tree.construct_widget(unreal.CanvasPanel.static_class(), \"RootCanvas\")\r\n        widget_tree.set_root_widget(root_canvas)\r\n        \r\n        # สร้างตารางสี่เหลี่ยม Uniform Grid สำหรับแบ่งไอคอนแอป\r\n        grid = widget_tree.construct_widget(unreal.UniformGridPanel.static_class(), \"AppGrid\")\r\n        grid_slot = root_canvas.add_child(grid)\r\n        grid_slot.set_anchors(unreal.Anchors(minimum=[0.1, 0.1], maximum=[0.9, 0.8]))\r\n        grid_slot.set_offsets(unreal.Margin(left=0.0, top=0.0, right=0.0, bottom=0.0))\r\n        \r\n        # ปั๊มปุ่มจำลองไอคอนแอปพลิเคชัน 4 แอปหลัก\r\n        apps = [\"Safari_Google\", \"Camera\", \"Calculator\", \"Files\"]\r\n        for i, app_name in enumerate(apps):\r\n            btn = widget_tree.construct_widget(unreal.Button.static_class(), f\"Btn_{app_name}\")\r\n            slot = grid.add_child_to_uniform_grid(btn)\r\n            slot.set_row(i // 2)\r\n            slot.set_column(i % 2)\r\n            \r\n        unreal.WidgetEditingLibrary.compile_widget_blueprint(menu_widget)\r\n        unreal.EditorAssetLibrary.save_asset(f\"{package_path}/WBP_iPad_MainMenu\")\r\n        unreal.log(\"ประกอบและบันทึกหน้า WBP_iPad_MainMenu สำเร็จ!\")\r\n\r\n# สั่งทำงานทันที\r\nbuild_ipad_ui_fixed()\r\n"
